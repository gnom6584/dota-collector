services:
  app:
    build: .
    container_name: dota_match_collector
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - ADMIN_HOST=0.0.0.0
      - ADMIN_PORT=8000
      - DB_PATH=/app/data/matches.db
      - LOCK_DIR=/app/data/locks
