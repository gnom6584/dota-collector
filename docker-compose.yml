services:
  dota-match-collector:
    build: .
    container_name: dota_match_collector
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/app/data/matches.db
    volumes:
      # Папка с базой данных SQLite на хосте
      - ./data:/app/data
    ports:
      # Порт для API и панели управления (FastAPI)
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
